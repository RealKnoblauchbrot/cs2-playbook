name: Release

# Push a tag like v0.2.0 (use `npm run release -- 0.2.0 "notes"`) to build the
# Windows installer, sign the update and publish a GitHub release. Installed apps
# find it through latest.json and offer the update on next launch.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read release notes from tag message
        id: notes
        shell: bash
        run: |
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          {
            echo 'body<<NOTES_EOF'
            git tag -l --format='%(contents)' "${GITHUB_REF_NAME}"
            echo 'NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: CS2 Playbook ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true

      # Same installer under a fixed name, so this link never changes and can be
      # pinned in Discord: releases/latest/download/CS2-Playbook-Setup.exe
      - name: Upload installer under a permanent name
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp "src-tauri/target/release/bundle/nsis/CS2 Playbook_${GITHUB_REF_NAME#v}_x64-setup.exe" CS2-Playbook-Setup.exe
          gh release upload "$GITHUB_REF_NAME" CS2-Playbook-Setup.exe --clobber
